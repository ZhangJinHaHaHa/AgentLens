name: Public boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject private or sensitive public content
        run: node scripts/check-public-boundary.mjs
      - name: Reject private or sensitive historical content
        run: node scripts/check-public-history.mjs
