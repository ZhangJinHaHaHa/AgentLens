<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentLens — Trusted Agent Marketplace</title>
    <meta name="description" content="The first marketplace where AI agent trust is verifiable, not just claimed. Audit reports, TEE attestation, risk profiles and on-chain reputation — before you commit." />
    <style>
      /* Popo welcome popup — inlined so it works before CSS bundle loads */
      #popo-welcome-root {
        position: fixed;
        bottom: 32px;
        right: 32px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fffcf5;
        border: 1px solid rgba(20,33,61,0.1);
        border-radius: 18px;
        padding: 16px 20px 16px 16px;
        box-shadow: 0 8px 32px rgba(20,33,61,0.14);
        max-width: 280px;
        font-family: "IBM Plex Sans", "Inter", system-ui, sans-serif;
        animation: popo-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #popo-welcome-root.leaving {
        animation: popo-out 0.5s ease-in forwards;
      }
      #popo-welcome-root img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 12px;
        flex-shrink: 0;
      }
      #popo-welcome-root .pw-text { display: flex; flex-direction: column; gap: 4px; }
      #popo-welcome-root .pw-greeting { font-size: 0.95rem; font-weight: 600; color: #14213d; margin: 0; }
      #popo-welcome-root .pw-sub { font-size: 0.78rem; color: #4b5563; margin: 0; line-height: 1.45; }
      #popo-welcome-root .pw-close {
        position: absolute; top: 8px; right: 10px;
        background: none; border: none; cursor: pointer;
        font-size: 1.1rem; color: #6b7280; line-height: 1; padding: 0 2px; opacity: 0.6;
      }
      #popo-welcome-root .pw-close:hover { opacity: 1; }
      @keyframes popo-in {
        from { opacity: 0; transform: translateY(60px) scale(0.92); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes popo-out {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to   { opacity: 0; transform: translateY(60px) scale(0.92); }
      }
      @media (max-width: 480px) {
        #popo-welcome-root { bottom: 16px; right: 16px; left: 16px; max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var KEY = 'agentlens_popo_v1';
        if (localStorage.getItem(KEY)) return;
        localStorage.setItem(KEY, '1');

        var el = document.createElement('div');
        el.id = 'popo-welcome-root';
        el.setAttribute('role', 'dialog');
        el.setAttribute('aria-label', 'Welcome from Popo');
        el.innerHTML = [
          '<button class="pw-close" aria-label="Dismiss">\xd7</button>',
          '<img src="/popo-mascot.png" alt="Popo mascot" />',
          '<div class="pw-text">',
          '  <p class="pw-greeting">Hi, I\'m <strong>Popo</strong>! \ud83c\udfd3</p>',
          '  <p class="pw-sub">Every agent here has been verified.<br>Browse with confidence.</p>',
          '</div>'
        ].join('');

        function dismiss() {
          el.classList.add('leaving');
          setTimeout(function() { el.remove(); }, 500);
        }

        el.querySelector('.pw-close').addEventListener('click', dismiss);

        setTimeout(function() { document.body.appendChild(el); }, 700);
        setTimeout(function() { el.classList.add('leaving'); }, 3700);
        setTimeout(function() { el.remove(); }, 4500);
      })();
    </script>
  </body>
</html>
